[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credito_pa"
version = "0.1.0"
description = "Projeto Integrador - Da Ingestao a Decisao: risco de credito municipal no Para"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
